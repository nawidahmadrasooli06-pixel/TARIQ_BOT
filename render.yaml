services:
  - type: web
    name: tariq-support-bot
    runtime: python
    plan: free

    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py

    envVars:
      - key: BOT_TOKEN
        sync: false

      - key: ADMIN_USERNAME
        value: Pv_Tariq

      - key: ADMIN_CHAT_ID
        sync: false

      - key: PYTHON_VERSION
        value: 3.12.10
